<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/js-datepicker/dist/datepicker.min.css"
>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />

    <title>M8 | Age Calculator</title>
  </head>
  <body>
    <main class="mx-auto mt-24 w-[90%] max-w-2xl sm:mt-40">
      <h1 class="mb-12 text-center text-5xl font-bold sm:mb-16 sm:text-6xl">
        Age Calculator
      </h1>

      <form id="ageForm" class="flex flex-col gap-4">
        <label for="birthDate" class="text-2xl font-bold sm:text-3xl">
          Enter your birth date:
        </label>

        <input
          type="text"
          id="birthDate"
          placeholder="DD/MM/YYYY"
          required
          autocomplete="off"
          class="h-16 w-full rounded-xl border-4 border-black bg-white px-5 text-xl outline-none focus:ring-2 focus:ring-gray-400 sm:h-20 sm:text-3xl"
        />

        <button
          type="submit"
          class="min-h-16 w-full rounded-xl bg-[#555] py-3 text-2xl font-bold text-white transition-colors hover:bg-[#333] sm:min-h-20 sm:text-3xl"
        >
          Calculate
        </button>
      </form>

      <p
        id="result"
        aria-live="polite"
        class="mt-10 text-center text-2xl font-bold leading-relaxed sm:mt-12 sm:text-3xl"
      ></p>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
